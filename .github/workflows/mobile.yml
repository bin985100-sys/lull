# Lull Mobile (Expo): Android APK и веб-версия. iOS добавим, когда будет аккаунт Apple Developer.
name: Lull Mobile

on:
  workflow_dispatch:
  push:
    branches: [mobile, main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Зависимости сервера для тестов
        working-directory: .
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1', PUPPETEER_SKIP_DOWNLOAD: '1' }
        run: npm ci --ignore-scripts
      - name: Тесты входа и синхронизации
        run: node scripts/sync.test.mjs
      - name: Тесты плеера
        run: node scripts/player.test.mjs
      - name: Тесты локального кэша звука
        run: node --test scripts/audio-cache.test.mjs
      - name: Тесты текста песен
        run: node scripts/lyrics.test.mjs
      - run: npx expo export -p web
      - uses: actions/upload-artifact@v4
        with: { name: Lull-Mobile-Web, path: mobile/dist, if-no-files-found: error }

  android:
    needs: check          # тесты не прошли — APK не собираем
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx expo prebuild -p android --no-install
      - name: APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      # Тестовая сборка подписана отладочным ключом Expo. Старое Android-приложение перед установкой нужно удалить.
      - name: Файл
        run: mkdir -p out && cp "$(ls android/app/build/outputs/apk/release/*.apk | head -1)" out/Lull-Mobile.apk
      - uses: actions/upload-artifact@v4
        with: { name: Lull-Mobile-Android, path: mobile/out/Lull-Mobile.apk, if-no-files-found: error }
      # Прямая ссылка без входа в GitHub: https://github.com/<repo>/releases/download/mobile-latest/Lull-Mobile.apk
      - name: Прямая ссылка на APK
        if: github.ref == 'refs/heads/mobile'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mobile-latest >/dev/null 2>&1 || gh release create mobile-latest --prerelease --title "Lull Mobile" --notes "Свежая сборка Lull для Android. Обновляется после каждого изменения." --target "$GITHUB_SHA"
          gh release upload mobile-latest out/Lull-Mobile.apk --clobber
