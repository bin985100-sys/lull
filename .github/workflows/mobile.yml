# Lull Mobile (Expo): Android APK и веб-версия. iOS добавим, когда будет аккаунт Apple Developer.
name: Lull Mobile

on:
  workflow_dispatch:
  push:
    branches: [mobile, main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export -p web
      - uses: actions/upload-artifact@v4
        with: { name: Lull-Mobile-Web, path: mobile/dist, if-no-files-found: error }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx expo prebuild -p android --no-install
      - name: APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      # Тестовая сборка подписана отладочным ключом Expo. Старое Android-приложение перед установкой нужно удалить.
      - name: Файл
        run: mkdir -p out && cp "$(ls android/app/build/outputs/apk/release/*.apk | head -1)" out/Lull-Mobile.apk
      - uses: actions/upload-artifact@v4
        with: { name: Lull-Mobile-Android, path: mobile/out/Lull-Mobile.apk, if-no-files-found: error }
