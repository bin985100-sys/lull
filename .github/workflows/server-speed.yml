# Замер скорости звука с сервера Lull (холодный и повторный старт трека)
name: Lull server speed
on:
  workflow_dispatch:
  push:
    branches: [mobile]
    paths: ['.github/workflows/server-speed.yml']
jobs:
  speed:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.lull.website
          for id in ${IDS:-JGwWNGJdvx8 RgKAFK5djSk CevxZvSJLk8 e-ORhEE9VVg 2Vv-BfVoq4g}; do
            t=$(curl -s -o /dev/null -H "Range: bytes=0-65535" -w "%{http_code} first=%{time_starttransfer}s" "$A/api/stream/$id?q=aac")
            t2=$(curl -s -o /dev/null -H "Range: bytes=65536-131071" -w "%{http_code} first=%{time_starttransfer}s" "$A/api/stream/$id?q=aac")
            echo "::warning title=stream $id::cold $t | warm $t2"
          done
