# Замер скорости звука с сервера Lull (холодный и повторный старт трека) + разбор по способам на самом сервере
name: Lull server speed
on:
  workflow_dispatch:
  push:
    branches: [mobile]
    paths: ['.github/workflows/server-speed.yml']
jobs:
  speed:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.lull.website
          echo "::warning title=diag::$(curl -s -m 120 "$A/api/diag?vid=fJ9rUzIMcZQ" | head -c 1500)"
          for id in hTWKbfoikeg 09R8_2nJtjg YQHsXMglC9A; do
            t=$(curl -s -o /tmp/b -H "Range: bytes=0-65535" -w "%{http_code} first=%{time_starttransfer}s" -m 90 "$A/api/stream/$id?q=aac")
            t2=$(curl -s -o /dev/null -H "Range: bytes=65536-131071" -w "%{http_code} first=%{time_starttransfer}s" -m 60 "$A/api/stream/$id?q=aac")
            echo "::warning title=stream $id::cold $t | warm $t2 | $(head -c 300 /tmp/b | tr -d '\000-\037' | grep -a -o '^{.*' || echo audio)"
          done
