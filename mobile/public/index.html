<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: рисуем под «островом» и полоской «домой», отступы берём из env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Lull</title>
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Lull — музыка ближе." />

    <!-- Установка на экран «Домой»: открывается без интерфейса браузера, как приложение -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lull" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />

    <!-- Заставки запуска под каждый размер iPhone (иначе iOS показывает белый экран) -->

    <link rel="apple-touch-startup-image" href="/splash/1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1260x2736.png" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <link rel="apple-touch-startup-image" href="/splash/1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <style id="expo-reset">
      /* Корень приложения закреплён на весь экран: без резиновой прокрутки страницы,
         без скачков высоты от панели браузера. Высота берётся из 100dvh / fill-available,
         а не из 100vh, который на iPhone длиннее видимой области — из-за этого низ обрезался. */
      html {
        height: 100%;
        height: -webkit-fill-available;
        background: #000;
        color-scheme: dark;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        position: fixed;
        inset: 0;
        height: 100%;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #000;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
      input, textarea { -webkit-user-select: text; user-select: text; }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background: #000;
      }
      /* Внутренние списки прокручиваются с инерцией и не тянут за собой страницу */
      #root [style*="overflow"] { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
      ::-webkit-scrollbar { display: none; }
      * { scrollbar-width: none; }
    </style>
    <script>
      /* Офлайн-оболочка и быстрый повторный запуск */
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
      }
    </script>
  </head>

  <body>
    <noscript>Для Lull нужен JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
